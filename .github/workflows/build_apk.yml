name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Recreate Complete Flutter Project
      run: |
        mkdir temp_dir
        cp lib/main.dart temp_dir/main.dart 2>/dev/null || true
        cp pubspec.yaml temp_dir/pubspec.yaml 2>/dev/null || true
        rm -rf lib pubspec.yaml android ios web macos windows linux
        flutter create . --org com.dcsc.app --project-name dcsc_app
        cp temp_dir/main.dart lib/main.dart 2>/dev/null || true
        cp temp_dir/pubspec.yaml pubspec.yaml 2>/dev/null || true
        rm -rf temp_dir

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
